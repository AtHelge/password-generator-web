<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .pw-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .pw-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1rem;
            color: #4ade80;
            word-break: break-all;
            user-select: all;
        }
        button {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Password Generator</h1>
        <p class="subtitle">generates random passwords with Python secrets</p>
        
        <div class="pw-list">
            {% for pw in passwords %}
                <div class="pw-box">{{ pw }}</div>
            {% endfor %}
        </div>

        <form method="get">
            <button type="submit">generate new passwords</button>
        </form>
    </div>
</body>
</html>
